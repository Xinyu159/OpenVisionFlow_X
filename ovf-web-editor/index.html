<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenVisionFlow - 可视化流程编辑器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部菜单栏 -->
    <header class="menu-bar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <span>OpenVisionFlow</span>
        </div>
        <nav class="menu-items">
            <button id="btn-new" class="menu-btn" title="新建流程">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 1v6H2v2h6v6h2V9h6V7H9V1H8z"/>
                </svg>
                <span>新建</span>
            </button>
            <button id="btn-open" class="menu-btn" title="打开流程">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 2h5l2 2h5v10H2V2zm1 1v10h10V5H8.5l-2-2H3z"/>
                </svg>
                <span>打开</span>
            </button>
            <button id="btn-save" class="menu-btn" title="保存流程">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M13 16H3c-1.1 0-2-.9-2-2V2c0-1.1.9-2 2-2h7l4 4v10c0 1.1-.9 2-2 2zM9 1H3c-.6 0-1 .4-1 1v12c0 .6.4 1 1 1h10c.6 0 1-.4 1-1V5l-3-4h-2v4H5V1h4zm1 0v3h2l-2-3zM5 10h6v1H5v-1zm0 2h6v1H5v-1z"/>
                </svg>
                <span>保存</span>
            </button>
            <div class="menu-divider"></div>
            <button id="btn-run" class="menu-btn primary" title="运行流程">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M4 2l10 6-10 6V2z"/>
                </svg>
                <span>运行</span>
            </button>
            <button id="btn-step" class="menu-btn" title="单步调试">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 1v6h6v2H8v6H6V9H0V7h6V1h2z"/>
                </svg>
                <span>单步</span>
            </button>
            <button id="btn-stop" class="menu-btn danger" title="停止执行" disabled>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <rect x="2" y="2" width="12" height="12"/>
                </svg>
                <span>停止</span>
            </button>
        </nav>
    </header>

    <!-- 主体区域 -->
    <main class="main-container">
        <!-- 左侧节点面板 -->
        <aside class="node-panel">
            <div class="panel-header">
                <h3>节点类型</h3>
                <input type="text" id="node-search" placeholder="搜索节点..." class="search-input">
            </div>
            <div class="node-list" id="node-list">
                <!-- 节点类型将通过JS动态生成 -->
            </div>
        </aside>

        <!-- 中间画布区域 -->
        <div class="canvas-container">
            <div class="canvas-toolbar">
                <button id="btn-zoom-in" class="tool-btn" title="放大">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
                        <path d="M11 11l3 3M5 7h4M7 5v4"/>
                    </svg>
                </button>
                <button id="btn-zoom-out" class="tool-btn" title="缩小">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
                        <path d="M11 11l3 3M5 7h4"/>
                    </svg>
                </button>
                <button id="btn-fit-view" class="tool-btn" title="适应视图">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1 3h2v2H1V3zm12 0h2v2h-2V3zM1 11h2v2H1v-2zm12 0h2v2h-2v-2z"/>
                        <rect x="3" y="3" width="10" height="10" stroke="currentColor" stroke-width="1" fill="none"/>
                    </svg>
                </button>
                <span class="zoom-level" id="zoom-level">100%</span>
            </div>
            <div class="canvas-wrapper" id="canvas-wrapper">
                <canvas id="flow-canvas"></canvas>
                <svg class="connection-svg" id="connection-svg"></svg>
            </div>
        </div>

        <!-- 右侧属性面板 -->
        <aside class="property-panel" id="property-panel">
            <div class="panel-header">
                <h3>属性</h3>
            </div>
            <div class="property-content" id="property-content">
                <div class="no-selection">
                    <p>选择一个节点查看属性</p>
                </div>
            </div>
        </aside>
    </main>

    <!-- 底部状态栏 -->
    <footer class="status-bar">
        <div class="status-left">
            <span class="status-item" id="status-execution">
                <span class="status-dot"></span>
                <span>就绪</span>
            </span>
        </div>
        <div class="status-center">
            <span class="status-item" id="status-message">欢迎使用 OpenVisionFlow</span>
        </div>
        <div class="status-right">
            <span class="status-item" id="status-time"></span>
            <span class="status-item" id="status-position">X: 0, Y: 0</span>
        </div>
    </footer>

    <!-- 右键菜单 -->
    <div class="context-menu" id="context-menu">
        <button class="context-menu-item" data-action="copy">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <path d="M3 1h6l3 3v7c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1V2c0-.6.4-1 1-1zm0 1v9h8V5H6V2H3z"/>
            </svg>
            <span>复制节点</span>
        </button>
        <button class="context-menu-item" data-action="delete">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <path d="M4 1h6v1h1v11H3V2h1V1zm1 1v1h4V2H5zm-1 2v8h6V4H4z"/>
            </svg>
            <span>删除节点</span>
        </button>
        <div class="context-menu-divider"></div>
        <button class="context-menu-item" data-action="disable">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <path d="M3 3l8 8" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>禁用节点</span>
        </button>
    </div>

    <!-- 节点参数对话框 -->
    <div class="modal" id="node-dialog">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="dialog-title">节点参数</h3>
                <button class="modal-close" id="dialog-close">×</button>
            </div>
            <div class="modal-body" id="dialog-body">
                <!-- 动态生成的参数表单 -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="dialog-cancel">取消</button>
                <button class="btn btn-primary" id="dialog-ok">确定</button>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <!-- JavaScript 文件 -->
    <script src="js/api.js"></script>
    <script src="js/flow.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
